<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend Flappy</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

#gameBox {
  position: relative;
  width: min(100vw, 430px);
  height: min(100vh, 760px);
  overflow: hidden;
  background: #000;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#restartBtn {
  position: absolute;
  z-index: 20;

  left: 50%;
  bottom: 55px;
  transform: translateX(-50%);

  display: none;

  border: 3px solid white;
  border-radius: 15px;

  background: rgba(0,0,0,0.8);
  color: white;

  padding: 13px 28px;

  font-size: 20px;
  font-weight: bold;

  cursor: pointer;
}

#restartBtn:active {
  transform: translateX(-50%) scale(0.95);
}
</style>
</head>

<body>

<div id="gameBox">

  <canvas
    id="game"
    width="430"
    height="760">
  </canvas>

  <button id="restartBtn">
    RESTART 🔄
  </button>

</div>


<script>

// =====================================================
// CANVAS
// =====================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const restartBtn = document.getElementById("restartBtn");


// =====================================================
// IMAGES
// =====================================================

// Friend photo

const friendImg = new Image();
friendImg.src = "friend.png";


// Game over photo

const loseImg = new Image();
loseImg.src = "lose.png";


// Six backgrounds

const backgrounds = [];

for (let i = 1; i <= 6; i++) {

  const img = new Image();

  img.src = "bg" + i + ".png";

  backgrounds.push(img);

}


// =====================================================
// AUDIO
// =====================================================

// Intro/start voice

const startSound = new Audio("start.mp3");


// Three tap voices

const touchSounds = [
  new Audio("touch1.mp3"),
  new Audio("touch2.mp3"),
  new Audio("touch3.mp3")
];


// Game over voice

const gameOverSound = new Audio("gameover.mp3");


// Prevent sounds from being too loud

startSound.volume = 1;
gameOverSound.volume = 1;

touchSounds.forEach(sound => {
  sound.volume = 1;
});


// =====================================================
// PLAYER
// =====================================================

const player = {

  x: 75,
  y: 320,

  width: 92,
  height: 68,

  velocity: 0,

  rotation: 0,

  scale: 1

};


// =====================================================
// PHYSICS
// =====================================================

const gravity = 0.43;

const jumpPower = -7.6;


// =====================================================
// PIPE SETTINGS
// =====================================================

const pipeWidth = 68;

const pipeGap = 205;

let pipeSpeed = 3.1;


// =====================================================
// GAME STATE
// =====================================================

let started = false;

let gameOver = false;

let pipes = [];

let frame = 0;

let score = 0;

let deathVelocity = 0;


// =====================================================
// HIGH SCORE
// =====================================================

let highScore =
  Number(
    localStorage.getItem("friendFlappyBest")
  ) || 0;


// =====================================================
// BACKGROUND SCROLLING
// =====================================================

let backgroundIndex = 0;

let nextBackgroundIndex = 1;

let backgroundX = 0;


// How quickly scenery moves

const backgroundSpeed = 1.35;


// =====================================================
// DRAW IMAGE LIKE CSS "COVER"
// =====================================================

function drawCoverImage(img, x, y, width, height) {

  if (
    !img.complete ||
    img.naturalWidth === 0
  ) {
    return;
  }


  const imageRatio =
    img.naturalWidth /
    img.naturalHeight;


  const boxRatio =
    width /
    height;


  let sourceX = 0;
  let sourceY = 0;

  let sourceWidth =
    img.naturalWidth;

  let sourceHeight =
    img.naturalHeight;


  if (imageRatio > boxRatio) {

    sourceWidth =
      img.naturalHeight *
      boxRatio;


    sourceX =
      (
        img.naturalWidth -
        sourceWidth
      ) / 2;

  }

  else {

    sourceHeight =
      img.naturalWidth /
      boxRatio;


    sourceY =
      (
        img.naturalHeight -
        sourceHeight
      ) / 2;

  }


  ctx.drawImage(

    img,

    sourceX,
    sourceY,

    sourceWidth,
    sourceHeight,

    x,
    y,

    width,
    height

  );

}


// =====================================================
// START VOICE
// =====================================================

function playStartVoice() {

  startSound.pause();

  startSound.currentTime = 0;

  startSound.play().catch(() => {});

}


// =====================================================
// TAP VOICES
// =====================================================

// This remembers which sound was last used,
// so the same voice isn't repeated immediately.

let lastTouchSound = -1;


function playTapVoice() {

  let index;


  if (touchSounds.length === 1) {

    index = 0;

  }

  else {

    do {

      index =
        Math.floor(
          Math.random() *
          touchSounds.length
        );

    }
    while (index === lastTouchSound);

  }


  lastTouchSound = index;


  const sound = touchSounds[index];


  // Clone allows rapid taps to overlap naturally.

  const copy = sound.cloneNode();

  copy.volume = sound.volume;

  copy.play().catch(() => {});

}


// =====================================================
// CREATE PIPE
// =====================================================

function createPipe() {

  const minimumTop = 90;

  const maximumTop =
    canvas.height -
    pipeGap -
    150;


  const topHeight =
    Math.floor(

      Math.random() *
      (
        maximumTop -
        minimumTop
      )

    ) + minimumTop;


  pipes.push({

    x: canvas.width + 30,

    top: topHeight,

    bottom:
      topHeight +
      pipeGap,

    counted: false

  });

}


// =====================================================
// START GAME
// =====================================================

function startGame() {

  if (started) {
    return;
  }


  started = true;

  frame = 0;

  pipes = [];


  playStartVoice();

}


// =====================================================
// JUMP
// =====================================================

function jump() {

  if (gameOver) {
    return;
  }


  if (!started) {

    startGame();

    // First click starts the game.
    // Tap sound begins from following jumps.

  }

  else {

    playTapVoice();

  }


  player.velocity =
    jumpPower;


  player.rotation =
    -0.38;


  player.scale =
    1.10;

}


// =====================================================
// COLLISION
// =====================================================

function checkPipeCollision(pipe) {

  // Slightly forgiving hitbox

  const paddingX = 15;

  const paddingY = 10;


  const playerLeft =
    player.x +
    paddingX;


  const playerRight =
    player.x +
    player.width -
    paddingX;


  const playerTop =
    player.y +
    paddingY;


  const playerBottom =
    player.y +
    player.height -
    paddingY;


  const pipeLeft =
    pipe.x;


  const pipeRight =
    pipe.x +
    pipeWidth;


  const horizontalHit =

    playerRight >
    pipeLeft

    &&

    playerLeft <
    pipeRight;


  if (!horizontalHit) {

    return false;

  }


  if (
    playerTop <
    pipe.top
  ) {

    return true;

  }


  if (
    playerBottom >
    pipe.bottom
  ) {

    return true;

  }


  return false;

}


// =====================================================
// END GAME
// =====================================================

function endGame() {

  if (gameOver) {
    return;
  }


  gameOver = true;


  deathVelocity =
    player.velocity;


  // Save best score

  if (score > highScore) {

    highScore = score;


    localStorage.setItem(

      "friendFlappyBest",

      highScore

    );

  }


  // Stop intro if still playing

  startSound.pause();


  // Stop tap sounds

  touchSounds.forEach(sound => {

    sound.pause();

    sound.currentTime = 0;

  });


  // Game over voice

  gameOverSound.pause();

  gameOverSound.currentTime = 0;

  gameOverSound
    .play()
    .catch(() => {});


  // Restart button appears shortly after losing

  setTimeout(() => {

    if (gameOver) {

      restartBtn.style.display =
        "block";

    }

  }, 700);

}


// =====================================================
// RESTART
// =====================================================

function restartGame() {

  // Stop game-over audio

  gameOverSound.pause();

  gameOverSound.currentTime = 0;


  // Stop intro

  startSound.pause();

  startSound.currentTime = 0;


  // Reset tap sounds

  touchSounds.forEach(sound => {

    sound.pause();

    sound.currentTime = 0;

  });


  // Player

  player.x = 75;

  player.y = 320;

  player.velocity = 0;

  player.rotation = 0;

  player.scale = 1;


  // Game

  pipes = [];

  frame = 0;

  score = 0;

  pipeSpeed = 3.1;


  started = false;

  gameOver = false;


  // Background starts from first image again

  backgroundIndex = 0;

  nextBackgroundIndex = 1;

  backgroundX = 0;


  lastTouchSound = -1;


  restartBtn.style.display =
    "none";

}


// =====================================================
// UPDATE BACKGROUND
// =====================================================

function updateBackground() {

  if (
    !started ||
    gameOver
  ) {
    return;
  }


  backgroundX -=
    backgroundSpeed;


  // Once one entire screen has passed,
  // move to next background.

  if (
    backgroundX <=
    -canvas.width
  ) {

    backgroundX +=
      canvas.width;


    backgroundIndex =
      nextBackgroundIndex;


    nextBackgroundIndex =
      (
        nextBackgroundIndex + 1
      )
      %
      backgrounds.length;

  }

}


// =====================================================
// DRAW MOVING BACKGROUNDS
// =====================================================

function drawBackground() {

  // Backup colour while images load

  ctx.fillStyle = "#70c5ce";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const current =
    backgrounds[backgroundIndex];


  const next =
    backgrounds[nextBackgroundIndex];


  // Current scenery moving left

  drawCoverImage(

    current,

    backgroundX,

    0,

    canvas.width,
    canvas.height

  );


  // Next scenery entering from right

  drawCoverImage(

    next,

    backgroundX +
    canvas.width,

    0,

    canvas.width,
    canvas.height

  );

}


// =====================================================
// UPDATE PLAYER
// =====================================================

function updatePlayer() {

  if (!started) {

    // Small floating animation
    // before game starts

    player.y =
      320 +
      Math.sin(
        performance.now() /
        350
      ) *
      7;

    return;

  }


  if (gameOver) {

    return;

  }


  player.velocity +=
    gravity;


  player.y +=
    player.velocity;


  // Falling rotation

  if (
    player.velocity > 0
  ) {

    player.rotation +=
      0.027;

  }


  if (
    player.rotation > 1.15
  ) {

    player.rotation =
      1.15;

  }


  // Jump squash animation back to normal

  player.scale +=

    (
      1 -
      player.scale
    )

    *

    0.14;

}


// =====================================================
// UPDATE DEATH
// =====================================================

function updateDeath() {

  if (!gameOver) {
    return;
  }


  deathVelocity +=
    0.55;


  player.y +=
    deathVelocity;


  player.rotation +=
    0.10;


  if (
    player.y >
    canvas.height +
    120
  ) {

    player.y =
      canvas.height +
      120;

  }

}


// =====================================================
// UPDATE PIPES
// =====================================================

function updatePipes() {

  if (
    !started ||
    gameOver
  ) {

    return;

  }


  // New pipe every ~1.6 seconds at 60fps

  if (
    frame % 100 === 0
  ) {

    createPipe();

  }


  for (
    const pipe of pipes
  ) {

    pipe.x -=
      pipeSpeed;


    // Collision

    if (
      checkPipeCollision(pipe)
    ) {

      endGame();

      return;

    }


    // Passed pipe

    if (
      !pipe.counted
      &&
      pipe.x +
      pipeWidth <
      player.x
    ) {

      pipe.counted =
        true;


      score++;


      // Slowly make game faster

      pipeSpeed =
        Math.min(

          5.3,

          3.1 +
          score *
          0.045

        );

    }

  }


  // Remove pipes that left screen

  pipes =
    pipes.filter(

      pipe =>
        pipe.x >
        -pipeWidth -
        20

    );

}


// =====================================================
// WORLD COLLISION
// =====================================================

function checkWorldCollision() {

  if (
    !started ||
    gameOver
  ) {

    return;

  }


  // Top

  if (
    player.y <= 0
  ) {

    player.y = 0;

    endGame();

    return;

  }


  // Bottom

  if (
    player.y +
    player.height >=
    canvas.height
  ) {

    endGame();

  }

}


// =====================================================
// UPDATE EVERYTHING
// =====================================================

function update() {

  updateBackground();

  updatePlayer();

  updatePipes();

  checkWorldCollision();

  updateDeath();


  if (
    started &&
    !gameOver
  ) {

    frame++;

  }

}


// =====================================================
// DRAW PIPES
// =====================================================

function drawPipes() {

  for (
    const pipe of pipes
  ) {

    // Shadow

    ctx.fillStyle =
      "rgba(0,0,0,0.22)";


    ctx.fillRect(

      pipe.x + 6,

      0,

      pipeWidth,

      pipe.top

    );


    ctx.fillRect(

      pipe.x + 6,

      pipe.bottom,

      pipeWidth,

      canvas.height -
      pipe.bottom

    );


    // Main green pipe

    ctx.fillStyle =
      "#45b649";


    ctx.fillRect(

      pipe.x,

      0,

      pipeWidth,

      pipe.top

    );


    ctx.fillRect(

      pipe.x,

      pipe.bottom,

      pipeWidth,

      canvas.height -
      pipe.bottom

    );


    // Pipe mouths

    ctx.fillStyle =
      "#2f9638";


    ctx.fillRect(

      pipe.x - 6,

      pipe.top - 28,

      pipeWidth + 12,

      28

    );


    ctx.fillRect(

      pipe.x - 6,

      pipe.bottom,

      pipeWidth + 12,

      28

    );


    // Highlights

    ctx.fillStyle =
      "rgba(255,255,255,0.20)";


    ctx.fillRect(

      pipe.x + 8,

      0,

      8,

      pipe.top - 28

    );


    ctx.fillRect(

      pipe.x + 8,

      pipe.bottom + 28,

      8,

      canvas.height -
      pipe.bottom -
      28

    );

  }

}


// =====================================================
// DRAW BIRD + FRIEND PHOTO
// =====================================================

function drawPlayer() {

  // Don't draw bird once lose image is showing

  if (
    gameOver &&
    player.y >
    canvas.height
  ) {

    return;

  }


  const centerX =
    player.x +
    player.width / 2;


  const centerY =
    player.y +
    player.height / 2;


  ctx.save();


  ctx.translate(
    centerX,
    centerY
  );


  ctx.rotate(
    player.rotation
  );


  ctx.scale(
    player.scale,
    player.scale
  );


  // -----------------------------
  // TAIL
  // -----------------------------

  ctx.fillStyle =
    "#ff922b";


  ctx.beginPath();


  ctx.moveTo(
    -38,
    -4
  );


  ctx.lineTo(
    -59,
    -20
  );


  ctx.lineTo(
    -54,
    4
  );


  ctx.lineTo(
    -61,
    18
  );


  ctx.lineTo(
    -37,
    12
  );


  ctx.closePath();

  ctx.fill();


  // -----------------------------
  // BIRD BODY
  // -----------------------------

  ctx.fillStyle =
    "#ffd43b";


  ctx.beginPath();


  ctx.ellipse(

    -3,
    5,

    43,
    29,

    0,

    0,

    Math.PI * 2

  );


  ctx.fill();


  // Body outline

  ctx.strokeStyle =
    "rgba(0,0,0,0.35)";


  ctx.lineWidth = 3;

  ctx.stroke();


  // -----------------------------
  // WING
  // -----------------------------

  ctx.fillStyle =
    "#f59f00";


  ctx.beginPath();


  ctx.ellipse(

    -28,
    10,

    20,
    14,

    -0.25,

    0,

    Math.PI * 2

  );


  ctx.fill();


  // -----------------------------
  // BEAK
  // -----------------------------

  ctx.fillStyle =
    "#ff6b35";


  ctx.beginPath();


  ctx.moveTo(
    38,
    1
  );


  ctx.lineTo(
    62,
    11
  );


  ctx.lineTo(
    38,
    21
  );


  ctx.closePath();

  ctx.fill();


  // -----------------------------
  // FRIEND FACE
  // -----------------------------

  // Large face on bird's head

  const faceX = 12;

  const faceY = -5;

  const faceRadius = 31;


  ctx.save();


  ctx.beginPath();


  ctx.arc(

    faceX,
    faceY,

    faceRadius,

    0,

    Math.PI * 2

  );


  ctx.clip();


  if (
    friendImg.complete &&
    friendImg.naturalWidth > 0
  ) {

    // Crop friend photo to square
    // instead of stretching face.

    const size =
      Math.min(

        friendImg.naturalWidth,

        friendImg.naturalHeight

      );


    const sx =
      (
        friendImg.naturalWidth -
        size
      ) / 2;


    const sy =
      (
        friendImg.naturalHeight -
        size
      ) / 2;


    ctx.drawImage(

      friendImg,

      sx,
      sy,

      size,
      size,

      faceX -
      faceRadius,

      faceY -
      faceRadius,

      faceRadius * 2,

      faceRadius * 2

    );

  }


  ctx.restore();


  // Face border

  ctx.strokeStyle =
    "white";


  ctx.lineWidth = 4;


  ctx.beginPath();


  ctx.arc(

    faceX,
    faceY,

    faceRadius,

    0,

    Math.PI * 2

  );


  ctx.stroke();


  ctx.restore();

}


// =====================================================
// DRAW SCORE
// =====================================================

function drawScore() {

  if (gameOver) {
    return;
  }


  ctx.textAlign =
    "center";


  ctx.lineJoin =
    "round";


  ctx.font =
    "bold 42px Arial";


  ctx.lineWidth = 7;

  ctx.strokeStyle =
    "rgba(0,0,0,0.55)";


  ctx.fillStyle =
    "white";


  ctx.strokeText(

    score,

    canvas.width / 2,

    62

  );


  ctx.fillText(

    score,

    canvas.width / 2,

    62

  );


  ctx.font =
    "bold 16px Arial";


  ctx.lineWidth = 4;


  ctx.strokeText(

    "BEST: " +
    highScore,

    canvas.width / 2,

    91

  );


  ctx.fillText(

    "BEST: " +
    highScore,

    canvas.width / 2,

    91

  );

}


// =====================================================
// START SCREEN
// =====================================================

function drawStartScreen() {

  if (
    started ||
    gameOver
  ) {

    return;

  }


  ctx.fillStyle =
    "rgba(0,0,0,0.50)";


  ctx.fillRect(

    35,
    190,

    canvas.width - 70,
    185

  );


  ctx.textAlign =
    "center";


  ctx.fillStyle =
    "white";


  ctx.font =
    "bold 30px Arial";


  ctx.fillText(

    "FRIEND FLAPPY 😂",

    canvas.width / 2,

    245

  );


  ctx.font =
    "bold 19px Arial";


  ctx.fillText(

    "TAP TO START",

    canvas.width / 2,

    300

  );


  ctx.font =
    "15px Arial";


  ctx.fillText(

    "Click • Tap • SPACE • ↑",

    canvas.width / 2,

    335

  );

}


// =====================================================
// DRAW GAME OVER
// =====================================================

function drawGameOver() {

  if (!gameOver) {
    return;
  }


  // Black fallback

  ctx.fillStyle =
    "black";


  ctx.fillRect(

    0,
    0,

    canvas.width,
    canvas.height

  );


  // Full-screen lose photo

  drawCoverImage(

    loseImg,

    0,
    0,

    canvas.width,
    canvas.height

  );


  // Dark overlay

  ctx.fillStyle =
    "rgba(0,0,0,0.22)";


  ctx.fillRect(

    0,
    0,

    canvas.width,
    canvas.height

  );


  // Text

  ctx.textAlign =
    "center";


  ctx.fillStyle =
    "white";


  ctx.strokeStyle =
    "black";


  ctx.lineJoin =
    "round";


  ctx.lineWidth = 8;


  ctx.font =
    "bold 38px Arial";


  ctx.strokeText(

    "GAME OVER 😂",

    canvas.width / 2,

    70

  );


  ctx.fillText(

    "GAME OVER 😂",

    canvas.width / 2,

    70

  );


  ctx.font =
    "bold 27px Arial";


  ctx.lineWidth = 6;


  ctx.strokeText(

    "SCORE: " + score,

    canvas.width / 2,

    120

  );


  ctx.fillText(

    "SCORE: " + score,

    canvas.width / 2,

    120

  );


  ctx.font =
    "bold 20px Arial";


  ctx.strokeText(

    "BEST: " +
    highScore,

    canvas.width / 2,

    158

  );


  ctx.fillText(

    "BEST: " +
    highScore,

    canvas.width / 2,

    158

  );

}


// =====================================================
// DRAW EVERYTHING
// =====================================================

function draw() {

  drawBackground();

  drawPipes();

  drawPlayer();

  drawScore();

  drawStartScreen();


  // Last so lose.png covers entire game

  drawGameOver();

}


// =====================================================
// GAME LOOP
// =====================================================

function gameLoop() {

  update();

  draw();


  requestAnimationFrame(
    gameLoop
  );

}


gameLoop();


// =====================================================
// TOUCH + MOUSE
// =====================================================

canvas.addEventListener(

  "pointerdown",

  function(event) {

    event.preventDefault();

    jump();

  }

);


// =====================================================
// KEYBOARD
// =====================================================

document.addEventListener(

  "keydown",

  function(event) {

    if (

      event.code === "Space"

      ||

      event.code === "ArrowUp"

    ) {

      event.preventDefault();


      jump();

    }

  }

);


// =====================================================
// RESTART
// =====================================================

restartBtn.addEventListener(

  "click",

  function(event) {

    event.preventDefault();

    event.stopPropagation();


    restartGame();

  }

);

</script>

</body>
</html>
