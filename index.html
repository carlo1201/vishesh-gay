<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend Flappy</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

#gameBox {
  position: relative;
  width: min(100vw, 430px);
  height: min(100vh, 760px);
  overflow: hidden;
  background: black;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#restartBtn {
  position: absolute;
  z-index: 50;

  left: 50%;
  bottom: 55px;
  transform: translateX(-50%);

  display: none;

  padding: 14px 30px;

  border: 3px solid white;
  border-radius: 15px;

  background: rgba(0,0,0,.82);
  color: white;

  font-size: 20px;
  font-weight: bold;

  cursor: pointer;
}

#restartBtn:active {
  transform: translateX(-50%) scale(.95);
}
</style>
</head>

<body>

<div id="gameBox">

  <canvas
    id="game"
    width="430"
    height="760">
  </canvas>

  <button id="restartBtn">
    RESTART 🔄
  </button>

</div>

<script>

// =====================================================
// CANVAS
// =====================================================

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const restartBtn =
  document.getElementById("restartBtn");


// =====================================================
// IMAGES
// =====================================================

const friendImg = new Image();
friendImg.src = "friend.png";


const loseImg = new Image();
loseImg.src = "lose.png";


const backgrounds = [];

for (let i = 1; i <= 6; i++) {

  const img = new Image();

  img.src = `bg${i}.png`;

  backgrounds.push(img);

}


// =====================================================
// AUDIO
// =====================================================

const startSound =
  new Audio("start.mp3");


const touchSounds = [

  new Audio("touch1.mp3"),

  new Audio("touch2.mp3"),

  new Audio("touch3.mp3")

];


const gameOverSound =
  new Audio("gameover.mp3");


// =====================================================
// AUDIO SETTINGS
// =====================================================

startSound.preload = "auto";

gameOverSound.preload = "auto";


touchSounds.forEach(sound => {

  sound.preload = "auto";

});


// =====================================================
// AUDIO SYSTEM
// IMPORTANT:
// ONLY ONE NORMAL VOICE CAN PLAY AT A TIME
// =====================================================

let activeNormalSound = null;


// Which touch voice comes next

let nextTouchIndex = 0;


// Number of requested voices waiting

let pendingTouchVoices = 0;


// True while intro/start voice is playing

let introPlaying = false;


// Used to cancel old audio callbacks after
// game over / restart

let audioSession = 0;


// =====================================================
// SAFE STOP AUDIO
// =====================================================

function stopAudio(audio) {

  if (!audio) return;


  audio.pause();


  try {

    audio.currentTime = 0;

  }
  catch (error) {}

}


// =====================================================
// STOP ALL NORMAL AUDIO
// =====================================================

function stopNormalAudio() {

  stopAudio(startSound);


  touchSounds.forEach(sound => {

    stopAudio(sound);

  });


  activeNormalSound = null;

  introPlaying = false;

  pendingTouchVoices = 0;

}


// =====================================================
// RESET AUDIO SYSTEM
// =====================================================

function resetAudioSystem() {

  audioSession++;


  stopNormalAudio();

  stopAudio(gameOverSound);


  nextTouchIndex = 0;

  pendingTouchVoices = 0;

  introPlaying = false;

  activeNormalSound = null;

}


// =====================================================
// START INTRO VOICE
// =====================================================

function playIntroVoice() {

  const mySession =
    audioSession;


  stopNormalAudio();


  introPlaying = true;

  activeNormalSound =
    startSound;


  startSound.currentTime = 0;


  startSound.play()
    .catch(() => {

      // If browser fails to play intro,
      // unlock touch voices.

      if (
        mySession === audioSession &&
        !gameOver
      ) {

        introPlaying = false;

        activeNormalSound = null;

        playNextTouchVoice();

      }

    });

}


// =====================================================
// WHEN INTRO ENDS
// =====================================================

startSound.addEventListener(
  "ended",
  function() {

    if (gameOver) return;


    introPlaying = false;

    activeNormalSound = null;


    playNextTouchVoice();

  }
);


// =====================================================
// REQUEST TOUCH VOICE
// =====================================================

function requestTouchVoice() {

  if (
    gameOver ||
    !started
  ) {

    return;

  }


  // Add one voice to queue.

  pendingTouchVoices++;


  // Don't play over intro.

  if (introPlaying) {

    return;

  }


  // Don't overlap current voice.

  if (activeNormalSound) {

    return;

  }


  playNextTouchVoice();

}


// =====================================================
// PLAY NEXT TOUCH VOICE
// =====================================================

function playNextTouchVoice() {

  if (gameOver) {

    pendingTouchVoices = 0;

    return;

  }


  if (introPlaying) {

    return;

  }


  if (activeNormalSound) {

    return;

  }


  if (pendingTouchVoices <= 0) {

    return;

  }


  pendingTouchVoices--;


  const sound =
    touchSounds[nextTouchIndex];


  nextTouchIndex =
    (nextTouchIndex + 1)
    %
    touchSounds.length;


  const mySession =
    audioSession;


  activeNormalSound =
    sound;


  sound.currentTime = 0;


  sound.play()
    .catch(() => {

      if (
        mySession !== audioSession
      ) {

        return;

      }


      if (gameOver) {

        return;

      }


      activeNormalSound = null;


      playNextTouchVoice();

    });

}


// =====================================================
// TOUCH VOICE FINISH EVENTS
// =====================================================

touchSounds.forEach(sound => {

  sound.addEventListener(
    "ended",
    function() {

      // Ignore old sound events.

      if (
        activeNormalSound !== sound
      ) {

        return;

      }


      activeNormalSound = null;


      if (gameOver) {

        pendingTouchVoices = 0;

        return;

      }


      playNextTouchVoice();

    }
  );

});


// =====================================================
// PLAYER
// =====================================================

const player = {

  x: 75,

  y: 320,

  width: 92,

  height: 68,

  velocity: 0,

  rotation: 0,

  scale: 1

};


// =====================================================
// PHYSICS
// =====================================================

const gravity = 0.43;

const jumpPower = -7.6;


// =====================================================
// PIPE SETTINGS
// =====================================================

const pipeWidth = 68;

const pipeGap = 205;

let pipeSpeed = 3.1;


// =====================================================
// GAME STATE
// =====================================================

let started = false;

let gameOver = false;

let pipes = [];

let frame = 0;

let score = 0;

let deathVelocity = 0;


// =====================================================
// HIGH SCORE
// =====================================================

let highScore =
  Number(
    localStorage.getItem(
      "friendFlappyBest"
    )
  ) || 0;


// =====================================================
// BACKGROUND
// =====================================================

let backgroundIndex = 0;

let nextBackgroundIndex = 1;

let backgroundX = 0;


const backgroundSpeed = 1.35;


// =====================================================
// DRAW COVER IMAGE
// =====================================================

function drawCoverImage(
  img,
  x,
  y,
  width,
  height
) {

  if (
    !img.complete ||
    img.naturalWidth === 0
  ) {

    return;

  }


  const imageRatio =
    img.naturalWidth /
    img.naturalHeight;


  const boxRatio =
    width /
    height;


  let sx = 0;

  let sy = 0;

  let sw =
    img.naturalWidth;

  let sh =
    img.naturalHeight;


  if (
    imageRatio >
    boxRatio
  ) {

    sw =
      img.naturalHeight *
      boxRatio;


    sx =
      (
        img.naturalWidth -
        sw
      ) / 2;

  }

  else {

    sh =
      img.naturalWidth /
      boxRatio;


    sy =
      (
        img.naturalHeight -
        sh
      ) / 2;

  }


  ctx.drawImage(

    img,

    sx,
    sy,
    sw,
    sh,

    x,
    y,
    width,
    height

  );

}


// =====================================================
// CREATE PIPE
// =====================================================

function createPipe() {

  const minTop = 90;


  const maxTop =
    canvas.height -
    pipeGap -
    150;


  const topHeight =
    Math.floor(

      Math.random() *
      (
        maxTop -
        minTop
      )

    ) + minTop;


  pipes.push({

    x:
      canvas.width +
      30,

    top:
      topHeight,

    bottom:
      topHeight +
      pipeGap,

    counted:
      false

  });

}


// =====================================================
// START GAME
// =====================================================

function startGame() {

  if (started) return;


  resetAudioSystem();


  started = true;

  gameOver = false;

  frame = 0;

  pipes = [];


  // Start voice ONLY.

  playIntroVoice();

}


// =====================================================
// JUMP
// =====================================================

function jump() {

  if (gameOver) {

    return;

  }


  // FIRST TAP

  if (!started) {

    startGame();


    // Jump immediately,
    // but don't play touch voice
    // on same tap as start.mp3.

    player.velocity =
      jumpPower;


    player.rotation =
      -0.38;


    player.scale =
      1.10;


    return;

  }


  // NORMAL JUMP

  player.velocity =
    jumpPower;


  player.rotation =
    -0.38;


  player.scale =
    1.10;


  // Queue voice.
  // It will NEVER overlap another voice.

  requestTouchVoice();

}


// =====================================================
// COLLISION
// =====================================================

function checkPipeCollision(pipe) {

  const paddingX = 15;

  const paddingY = 10;


  const left =
    player.x +
    paddingX;


  const right =
    player.x +
    player.width -
    paddingX;


  const top =
    player.y +
    paddingY;


  const bottom =
    player.y +
    player.height -
    paddingY;


  const pipeLeft =
    pipe.x;


  const pipeRight =
    pipe.x +
    pipeWidth;


  const touchingX =

    right >
    pipeLeft

    &&

    left <
    pipeRight;


  if (!touchingX) {

    return false;

  }


  return (

    top <
    pipe.top

    ||

    bottom >
    pipe.bottom

  );

}


// =====================================================
// GAME OVER
// =====================================================

function endGame() {

  if (gameOver) {

    return;

  }


  gameOver = true;


  deathVelocity =
    player.velocity;


  // ===================================================
  // MOST IMPORTANT AUDIO PART
  // ===================================================

  // Cancel callbacks/old queue

  audioSession++;


  // STOP start.mp3

  stopAudio(startSound);


  // STOP ALL touch voices immediately

  touchSounds.forEach(sound => {

    stopAudio(sound);

  });


  // Delete pending voices

  pendingTouchVoices = 0;

  activeNormalSound = null;

  introPlaying = false;


  // Make sure old gameover isn't playing

  stopAudio(gameOverSound);


  // ===================================================
  // ONLY GAMEOVER.MP3 NOW
  // ===================================================

  gameOverSound.currentTime = 0;


  gameOverSound
    .play()
    .catch(() => {});


  // Save high score

  if (
    score >
    highScore
  ) {

    highScore =
      score;


    localStorage.setItem(

      "friendFlappyBest",

      highScore

    );

  }


  // Restart button

  setTimeout(
    function() {

      if (gameOver) {

        restartBtn.style.display =
          "block";

      }

    },

    800
  );

}


// =====================================================
// RESTART
// =====================================================

function restartGame() {

  // Kill EVERY audio first.

  resetAudioSystem();


  player.x = 75;

  player.y = 320;

  player.velocity = 0;

  player.rotation = 0;

  player.scale = 1;


  pipes = [];


  frame = 0;

  score = 0;


  pipeSpeed = 3.1;


  started = false;

  gameOver = false;


  deathVelocity = 0;


  backgroundIndex = 0;

  nextBackgroundIndex = 1;

  backgroundX = 0;


  restartBtn.style.display =
    "none";

}


// =====================================================
// UPDATE BACKGROUND
// =====================================================

function updateBackground() {

  if (
    !started ||
    gameOver
  ) {

    return;

  }


  backgroundX -=
    backgroundSpeed;


  if (
    backgroundX <=
    -canvas.width
  ) {

    backgroundX +=
      canvas.width;


    backgroundIndex =
      nextBackgroundIndex;


    nextBackgroundIndex =
      (
        nextBackgroundIndex +
        1
      )
      %
      backgrounds.length;

  }

}


// =====================================================
// DRAW BACKGROUND
// =====================================================

function drawBackground() {

  ctx.fillStyle =
    "#70c5ce";


  ctx.fillRect(

    0,
    0,

    canvas.width,
    canvas.height

  );


  const current =
    backgrounds[
      backgroundIndex
    ];


  const next =
    backgrounds[
      nextBackgroundIndex
    ];


  drawCoverImage(

    current,

    backgroundX,
    0,

    canvas.width,
    canvas.height

  );


  drawCoverImage(

    next,

    backgroundX +
    canvas.width,

    0,

    canvas.width,
    canvas.height

  );

}


// =====================================================
// UPDATE PLAYER
// =====================================================

function updatePlayer() {

  if (!started) {

    player.y =

      320 +

      Math.sin(

        performance.now() /
        350

      ) * 7;


    return;

  }


  if (gameOver) {

    return;

  }


  player.velocity +=
    gravity;


  player.y +=
    player.velocity;


  if (
    player.velocity >
    0
  ) {

    player.rotation +=
      0.027;

  }


  if (
    player.rotation >
    1.15
  ) {

    player.rotation =
      1.15;

  }


  player.scale +=

    (
      1 -
      player.scale
    )

    *

    0.14;

}


// =====================================================
// DEATH ANIMATION
// =====================================================

function updateDeath() {

  if (!gameOver) {

    return;

  }


  deathVelocity +=
    0.55;


  player.y +=
    deathVelocity;


  player.rotation +=
    0.10;


  if (
    player.y >
    canvas.height +
    120
  ) {

    player.y =
      canvas.height +
      120;

  }

}


// =====================================================
// UPDATE PIPES
// =====================================================

function updatePipes() {

  if (
    !started ||
    gameOver
  ) {

    return;

  }


  if (
    frame % 100 === 0
  ) {

    createPipe();

  }


  for (
    const pipe of pipes
  ) {

    pipe.x -=
      pipeSpeed;


    if (
      checkPipeCollision(
        pipe
      )
    ) {

      endGame();

      return;

    }


    if (

      !pipe.counted

      &&

      pipe.x +
      pipeWidth <
      player.x

    ) {

      pipe.counted =
        true;


      score++;


      pipeSpeed =
        Math.min(

          5.3,

          3.1 +
          score *
          0.045

        );

    }

  }


  pipes =
    pipes.filter(

      pipe =>

        pipe.x >
        -pipeWidth -
        20

    );

}


// =====================================================
// WORLD COLLISION
// =====================================================

function checkWorldCollision() {

  if (
    !started ||
    gameOver
  ) {

    return;

  }


  if (
    player.y <= 0
  ) {

    player.y = 0;

    endGame();

    return;

  }


  if (

    player.y +
    player.height >=
    canvas.height

  ) {

    endGame();

  }

}


// =====================================================
// UPDATE
// =====================================================

function update() {

  updateBackground();

  updatePlayer();

  updatePipes();

  checkWorldCollision();

  updateDeath();


  if (
    started &&
    !gameOver
  ) {

    frame++;

  }

}


// =====================================================
// DRAW PIPES
// =====================================================

function drawPipes() {

  for (
    const pipe of pipes
  ) {

    // Shadow

    ctx.fillStyle =
      "rgba(0,0,0,.20)";


    ctx.fillRect(

      pipe.x + 6,

      0,

      pipeWidth,

      pipe.top

    );


    ctx.fillRect(

      pipe.x + 6,

      pipe.bottom,

      pipeWidth,

      canvas.height -
      pipe.bottom

    );


    // Pipes

    ctx.fillStyle =
      "#45b649";


    ctx.fillRect(

      pipe.x,

      0,

      pipeWidth,

      pipe.top

    );


    ctx.fillRect(

      pipe.x,

      pipe.bottom,

      pipeWidth,

      canvas.height -
      pipe.bottom

    );


    // Pipe heads

    ctx.fillStyle =
      "#2f9638";


    ctx.fillRect(

      pipe.x - 6,

      pipe.top - 28,

      pipeWidth + 12,

      28

    );


    ctx.fillRect(

      pipe.x - 6,

      pipe.bottom,

      pipeWidth + 12,

      28

    );


    // Highlight

    ctx.fillStyle =
      "rgba(255,255,255,.20)";


    ctx.fillRect(

      pipe.x + 8,

      0,

      8,

      Math.max(
        0,
        pipe.top - 28
      )

    );


    ctx.fillRect(

      pipe.x + 8,

      pipe.bottom + 28,

      8,

      Math.max(

        0,

        canvas.height -
        pipe.bottom -
        28

      )

    );

  }

}


// =====================================================
// DRAW PLAYER
// =====================================================

function drawPlayer() {

  if (
    gameOver &&
    player.y >
    canvas.height
  ) {

    return;

  }


  const centerX =
    player.x +
    player.width / 2;


  const centerY =
    player.y +
    player.height / 2;


  ctx.save();


  ctx.translate(
    centerX,
    centerY
  );


  ctx.rotate(
    player.rotation
  );


  ctx.scale(
    player.scale,
    player.scale
  );


  // ===================================================
  // TAIL
  // ===================================================

  ctx.fillStyle =
    "#ff922b";


  ctx.beginPath();


  ctx.moveTo(
    -38,
    -4
  );


  ctx.lineTo(
    -60,
    -20
  );


  ctx.lineTo(
    -54,
    4
  );


  ctx.lineTo(
    -61,
    18
  );


  ctx.lineTo(
    -37,
    12
  );


  ctx.closePath();

  ctx.fill();


  // ===================================================
  // BODY
  // ===================================================

  ctx.fillStyle =
    "#ffd43b";


  ctx.beginPath();


  ctx.ellipse(

    -3,
    5,

    43,
    29,

    0,

    0,

    Math.PI * 2

  );


  ctx.fill();


  ctx.strokeStyle =
    "rgba(0,0,0,.35)";


  ctx.lineWidth = 3;

  ctx.stroke();


  // ===================================================
  // WING
  // ===================================================

  ctx.fillStyle =
    "#f59f00";


  ctx.beginPath();


  ctx.ellipse(

    -28,
    10,

    20,
    14,

    -0.25,

    0,

    Math.PI * 2

  );


  ctx.fill();


  // ===================================================
  // BEAK
  // ===================================================

  ctx.fillStyle =
    "#ff6b35";


  ctx.beginPath();


  ctx.moveTo(
    38,
    1
  );


  ctx.lineTo(
    62,
    11
  );


  ctx.lineTo(
    38,
    21
  );


  ctx.closePath();

  ctx.fill();


  // ===================================================
  // FRIEND FACE
  // ===================================================

  const faceX = 12;

  const faceY = -5;

  const faceRadius = 31;


  ctx.save();


  ctx.beginPath();


  ctx.arc(

    faceX,
    faceY,

    faceRadius,

    0,

    Math.PI * 2

  );


  ctx.clip();


  if (

    friendImg.complete

    &&

    friendImg.naturalWidth >
    0

  ) {

    const size =
      Math.min(

        friendImg.naturalWidth,

        friendImg.naturalHeight

      );


    const sx =
      (
        friendImg.naturalWidth -
        size
      ) / 2;


    const sy =
      (
        friendImg.naturalHeight -
        size
      ) / 2;


    ctx.drawImage(

      friendImg,

      sx,
      sy,

      size,
      size,

      faceX -
      faceRadius,

      faceY -
      faceRadius,

      faceRadius * 2,

      faceRadius * 2

    );

  }


  ctx.restore();


  // Face border

  ctx.strokeStyle =
    "white";


  ctx.lineWidth = 4;


  ctx.beginPath();


  ctx.arc(

    faceX,
    faceY,

    faceRadius,

    0,

    Math.PI * 2

  );


  ctx.stroke();


  ctx.restore();

}


// =====================================================
// SCORE
// =====================================================

function drawScore() {

  if (gameOver) {

    return;

  }


  ctx.textAlign =
    "center";


  ctx.lineJoin =
    "round";


  ctx.fillStyle =
    "white";


  ctx.strokeStyle =
    "rgba(0,0,0,.6)";


  ctx.font =
    "bold 42px Arial";


  ctx.lineWidth = 7;


  ctx.strokeText(

    score,

    canvas.width / 2,

    62

  );


  ctx.fillText(

    score,

    canvas.width / 2,

    62

  );


  ctx.font =
    "bold 16px Arial";


  ctx.lineWidth = 4;


  ctx.strokeText(

    "BEST: " +
    highScore,

    canvas.width / 2,

    91

  );


  ctx.fillText(

    "BEST: " +
    highScore,

    canvas.width / 2,

    91

  );

}


// =====================================================
// START SCREEN
// =====================================================

function drawStartScreen() {

  if (
    started ||
    gameOver
  ) {

    return;

  }


  ctx.fillStyle =
    "rgba(0,0,0,.52)";


  ctx.fillRect(

    35,
    190,

    canvas.width - 70,

    185

  );


  ctx.fillStyle =
    "white";


  ctx.textAlign =
    "center";


  ctx.font =
    "bold 30px Arial";


  ctx.fillText(

    "FRIEND FLAPPY 😂",

    canvas.width / 2,

    245

  );


  ctx.font =
    "bold 19px Arial";


  ctx.fillText(

    "TAP TO START",

    canvas.width / 2,

    300

  );


  ctx.font =
    "15px Arial";


  ctx.fillText(

    "Tap • Click • SPACE • ↑",

    canvas.width / 2,

    335

  );

}


// =====================================================
// GAME OVER SCREEN
// =====================================================

function drawGameOver() {

  if (!gameOver) {

    return;

  }


  // Black backup

  ctx.fillStyle =
    "black";


  ctx.fillRect(

    0,
    0,

    canvas.width,
    canvas.height

  );


  // FULL SCREEN lose.png

  drawCoverImage(

    loseImg,

    0,
    0,

    canvas.width,
    canvas.height

  );


  // Small overlay

  ctx.fillStyle =
    "rgba(0,0,0,.20)";


  ctx.fillRect(

    0,
    0,

    canvas.width,
    canvas.height

  );


  // GAME OVER TEXT

  ctx.textAlign =
    "center";


  ctx.lineJoin =
    "round";


  ctx.fillStyle =
    "white";


  ctx.strokeStyle =
    "black";


  ctx.lineWidth = 8;


  ctx.font =
    "bold 38px Arial";


  ctx.strokeText(

    "GAME OVER 😂",

    canvas.width / 2,

    70

  );


  ctx.fillText(

    "GAME OVER 😂",

    canvas.width / 2,

    70

  );


  // SCORE

  ctx.font =
    "bold 27px Arial";


  ctx.lineWidth = 6;


  ctx.strokeText(

    "SCORE: " +
    score,

    canvas.width / 2,

    120

  );


  ctx.fillText(

    "SCORE: " +
    score,

    canvas.width / 2,

    120

  );


  // BEST

  ctx.font =
    "bold 20px Arial";


  ctx.strokeText(

    "BEST: " +
    highScore,

    canvas.width / 2,

    158

  );


  ctx.fillText(

    "BEST: " +
    highScore,

    canvas.width / 2,

    158

  );

}


// =====================================================
// DRAW
// =====================================================

function draw() {

  drawBackground();

  drawPipes();

  drawPlayer();

  drawScore();

  drawStartScreen();


  // Always last.

  drawGameOver();

}


// =====================================================
// GAME LOOP
// =====================================================

function gameLoop() {

  update();

  draw();


  requestAnimationFrame(
    gameLoop
  );

}


gameLoop();


// =====================================================
// MOBILE + MOUSE
// =====================================================

canvas.addEventListener(

  "pointerdown",

  function(event) {

    event.preventDefault();


    jump();

  }

);


// =====================================================
// KEYBOARD
// =====================================================

document.addEventListener(

  "keydown",

  function(event) {

    if (

      event.code ===
      "Space"

      ||

      event.code ===
      "ArrowUp"

    ) {

      event.preventDefault();


      jump();

    }

  }

);


// =====================================================
// RESTART BUTTON
// =====================================================

restartBtn.addEventListener(

  "click",

  function(event) {

    event.preventDefault();

    event.stopPropagation();


    restartGame();

  }

);

</script>

</body>
